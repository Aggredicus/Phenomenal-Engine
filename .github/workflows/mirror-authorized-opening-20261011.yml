name: Authorized one-time Mirror Delivery opening
on:
  push:
    branches:
      - gameplay/mirror-delivery-20261011-opening
permissions:
  contents: read
jobs:
  authoritative-opening:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted Phenomenal Engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run exactly one consented, authoritative local opening turn
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          from phenomenal_engine.consent import covenant_digest
          from phenomenal_engine.memory import verify_ledger
          from phenomenal_engine.github_saves import encode_state

          EXPECTED_DIGEST = "765091be9ea978c1c1d90ceee27bc26823dfca3b13b1aad446b6f8e79b53fb69"
          CAMPAIGN = "mirror_delivery_20261011_fresh"
          ACTION = "I arrive aboard Morrowglass and request the predeparture mission briefing."
          KEY = "mirror_delivery_20261011_fresh-opening-001"
          assert covenant_digest() == EXPECTED_DIGEST, "Covenant digest differs from user's consent"
          with tempfile.TemporaryDirectory() as tmp:
              save = Path(tmp) / (CAMPAIGN + ".json")
              accept = subprocess.run([
                  sys.executable, "-m", "phenomenal_engine", "accept-covenant", str(save),
                  "--account-id", "Aggredicus",
                  "--repository", "Aggredicus/Phenomenal-Engine",
                  "--visibility", "public", "--storage-choice", "public",
                  "--publication-understood", "--rules-accepted", "--agree", "--adult",
              ], capture_output=True, text=True, check=True)
              assert json.loads(accept.stdout)["status"] == "accepted_locally_unverified"
              result = subprocess.run([
                  sys.executable, "-m", "phenomenal_engine", "play",
                  "mods/mirror_delivery.json", str(save), ACTION,
                  "--seed", CAMPAIGN, "--idempotency-key", KEY,
              ], capture_output=True, text=True, check=True)
              status = json.loads(result.stdout)
              assert status["persisted"] is True and status["turn"] == 1
              assert status["state_version"] == 1 and status["created"] is True
              assert status["scene_packet"], "Missing actual Python engine scene packet"
              state = json.loads(save.read_text(encoding="utf-8"))
              assert verify_ledger(state)
              assert state["mod"]["id"] == "mirror_delivery"
              assert state["player_identity"]["name"] == "Jun Zan"
              assert state["turn"] == 1
              state["github_publication"] = {
                  "repository": "Aggredicus/Phenomenal-Engine",
                  "branch": "campaign-saves",
                  "path": "campaigns/" + CAMPAIGN + ".json",
                  "public": True,
                  "agreement_version": "DRAFT-0.1",
                  "agreement_sha256": EXPECTED_DIGEST,
                  "consent_record": "explicit affirmative user chat consent; locally asserted CLI receipt (not remotely published)",
                  "first_publication": "explicitly confirmed by player",
              }
              encode_state(state)
              payload = json.dumps(state, indent=2, ensure_ascii=True) + "\n"
              encoded = base64.b64encode(payload.encode("ascii")).decode("ascii")
              chunks = [encoded[i:i+1000] for i in range(0, len(encoded), 1000)]
              print("PHEN_AUTHORITY_OK:turn=1;state_version=1;mod=mirror_delivery;ledger=verified")
              print("PHEN_PAYLOAD_CHUNKS:" + str(len(chunks)))
              for i, part in enumerate(chunks):
                  print("PHEN_SAVE_CHUNK_" + str(i).zfill(5) + ":" + part)
              print("PHEN_PAYLOAD_END")
          PY
