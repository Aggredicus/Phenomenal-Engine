name: Phenomenal Engine CI

on:
  push:
    branches:
      - main
      - write-capable-play
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Python version
        run: python --version

      - name: Validate bundled mods
        run: python -m phenomenal_engine validate mods

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test persistent campaign
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          python -m phenomenal_engine play mods/concord_tournament.json "$tmp/concord.json" "Begin." --seed ci --idempotency-key ci-1
          python -m phenomenal_engine play mods/concord_tournament.json "$tmp/concord.json" "Inspect the ledger." --idempotency-key ci-2
          python -m phenomenal_engine status "$tmp/concord.json"

      - name: Check optional Codespaces startup remains opt-in
        run: |
          python -m phenomenal_engine start > /tmp/startup.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/startup.json", encoding="utf-8"))
          assert data["codespaces"]["choice"] == "offer"
          assert data["codespaces"]["default_enabled"] is False
          assert data["codespaces"]["created"] is False
          assert len(data["mods"]) == 3
          print("Codespaces is off by default.")
          PY

      - name: Verify canonical manifest
        run: python scripts/manifest.py --check
