name: Phenomenal Engine CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phenomenal-engine-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Fast full validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Python version
        run: python --version

      - name: Validate bundled mods
        run: python -m phenomenal_engine validate mods

      - name: Run unit tests
        run: python -m unittest discover -s tests -q

      - name: Smoke-test persistent campaign
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          python -m phenomenal_engine play mods/mirror_delivery.json "$tmp/mirror.json" "Begin." --seed ci --idempotency-key ci-1 >/dev/null
          python -m phenomenal_engine play mods/mirror_delivery.json "$tmp/mirror.json" "Inspect the Mir vault seal." --idempotency-key ci-2 >/dev/null
          python -m phenomenal_engine status "$tmp/mirror.json" >/dev/null

      - name: Check optional Codespaces startup remains opt-in
        run: |
          python -m phenomenal_engine start > /tmp/startup.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/startup.json", encoding="utf-8"))
          assert data["codespaces"]["choice"] == "offer"
          assert data["codespaces"]["default_enabled"] is False
          assert data["codespaces"]["created"] is False
          assert len(data["mods"]) == 3
          PY

      - name: Verify canonical manifest
        run: python scripts/manifest.py --check
